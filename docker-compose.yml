


services:
  postgres:
    image: postgres:16-alpine
    container_name: vegha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vegah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vegah_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vegah -d vegah_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegha-network

  redis:
    image: redis:7-alpine
    container_name: vegha-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vegha-network

  backend:
    image: ghcr.io/ashray240-b/vegha-backend:latest
    container_name: vegha-backend
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: vegah
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: vegah_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BACKEND_PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "3001"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - vegha-network

  worker:
    image: ghcr.io/ashray240-b/vegha-worker:latest
    container_name: vegha-worker
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vegha-network

  frontend:
    image: ghcr.io/ashray240-b/vegha-frontend:latest
    container_name: vegha-frontend
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - vegha-network

  nginx:
    image: nginx:alpine
    container_name: vegha-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - vegha-network

volumes:
  postgres_data:
  redis_data:

networks:
  vegha-network:
    driver: bridge
